<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="cardBgYellow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </radialGradient>
    <linearGradient id="sliceYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="yellowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="800" height="600" fill="url(#cardBgYellow)" />

  <!-- Whole Watermelon in Background -->
  <g transform="translate(430, 260)" filter="url(#yellowShadow)">
    <ellipse cx="60" cy="50" rx="140" ry="120" fill="#15803D" />
    <path d="M-40,0 Q10,50 -40,110" stroke="#052E16" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M20,-30 Q80,50 20,130" stroke="#052E16" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M80,-30 Q140,50 80,130" stroke="#052E16" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Yellow Watermelon Slice in Foreground -->
  <g transform="translate(160, 200)" filter="url(#yellowShadow)">
    <!-- Outer Dark Rind -->
    <path d="M 0 190 A 200 200 0 0 0 380 190 Z" fill="#166534" />
    <!-- Light Green Middle Rind -->
    <path d="M 12 184 A 186 186 0 0 0 368 184 Z" fill="#22C55E" />
    <!-- White Inner Rind -->
    <path d="M 22 178 A 174 174 0 0 0 358 178 Z" fill="#DCFCE7" />
    <!-- Golden Yellow Flesh -->
    <path d="M 32 172 A 162 162 0 0 0 348 172 Z" fill="url(#sliceYellow)" />

    <!-- Small Natural Seeds -->
    <ellipse cx="120" cy="210" rx="5" ry="9" fill="#1F2937" transform="rotate(-20 120 210)" />
    <ellipse cx="190" cy="245" rx="5" ry="9" fill="#1F2937" />
    <ellipse cx="260" cy="210" rx="5" ry="9" fill="#1F2937" transform="rotate(20 260 210)" />
    <ellipse cx="155" cy="275" rx="5" ry="9" fill="#1F2937" transform="rotate(-8 155 275)" />
    <ellipse cx="225" cy="275" rx="5" ry="9" fill="#1F2937" transform="rotate(8 225 275)" />

    <!-- Fresh Highlight -->
    <path d="M 80 174 A 130 130 0 0 0 200 250" stroke="#FEF08A" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.45" />
  </g>
</svg>
