<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gal3CleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gal3CleanBg)" />

  <!-- Clean Wholesale Market Stall & Stack Vector Graphic -->
  <g transform="translate(190, 130)">
    <!-- Market Stall Canopy -->
    <polygon points="210,30 20,95 400,95" fill="#C2410C" />
    <polygon points="210,30 50,95 120,95" fill="#EA580C" />
    <polygon points="210,30 300,95 370,95" fill="#EA580C" />

    <!-- Stall Pillars -->
    <rect x="40" y="95" width="14" height="190" fill="#64748B" rx="3"/>
    <rect x="365" y="95" width="14" height="190" fill="#64748B" rx="3"/>

    <!-- Fresh Watermelons Stack in Stall -->
    <g transform="translate(60, 140)">
      <!-- Base Layer -->
      <ellipse cx="50" cy="110" rx="38" ry="30" fill="#15803D" />
      <ellipse cx="125" cy="110" rx="38" ry="30" fill="#16A34A" />
      <ellipse cx="200" cy="110" rx="38" ry="30" fill="#15803D" />
      <ellipse cx="275" cy="110" rx="38" ry="30" fill="#16A34A" />

      <!-- Middle Layer -->
      <ellipse cx="88" cy="72" rx="36" ry="28" fill="#22C55E" />
      <ellipse cx="162" cy="72" rx="36" ry="28" fill="#4ADE80" />
      <ellipse cx="238" cy="72" rx="36" ry="28" fill="#22C55E" />

      <!-- Top Layer -->
      <ellipse cx="125" cy="38" rx="34" ry="26" fill="#15803D" />
      <ellipse cx="200" cy="38" rx="34" ry="26" fill="#16A34A" />

      <!-- Peak -->
      <ellipse cx="162" cy="8" rx="32" ry="24" fill="#22C55E" />
    </g>
  </g>
</svg>
