<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gal1CleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gal1CleanBg)" />

  <!-- Clean Truck & Logistics Vector Graphic -->
  <g transform="translate(200, 150)">
    <!-- Cargo Box Body -->
    <rect x="0" y="40" width="270" height="180" rx="12" fill="#0F766E" stroke="#14B8A6" stroke-width="3"/>
    
    <!-- Truck Cabin -->
    <path d="M 270 90 L 370 90 L 400 150 L 400 220 L 270 220 Z" fill="#0D9488" />
    <!-- Cabin Window -->
    <path d="M 285 105 L 355 105 L 380 150 L 285 150 Z" fill="#042F2E" opacity="0.65" />
    
    <!-- Headlight -->
    <rect x="390" y="180" width="10" height="24" rx="3" fill="#FDE047" />

    <!-- Wheels -->
    <circle cx="70" cy="235" r="38" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="70" cy="235" r="14" fill="#94A3B8" />
    
    <circle cx="210" cy="235" r="38" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="210" cy="235" r="14" fill="#94A3B8" />

    <circle cx="340" cy="235" r="38" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="340" cy="235" r="14" fill="#94A3B8" />

    <!-- Loaded Fresh Watermelons Inside/Top of Truck -->
    <g transform="translate(30, 60)">
      <ellipse cx="40" cy="50" rx="36" ry="28" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
      <ellipse cx="105" cy="45" rx="38" ry="30" fill="#16A34A" stroke="#4ADE80" stroke-width="2"/>
      <ellipse cx="170" cy="50" rx="36" ry="28" fill="#15803D" stroke="#22C55E" stroke-width="2"/>
      
      <ellipse cx="72" cy="18" rx="34" ry="26" fill="#22C55E" stroke="#86EFAC" stroke-width="2"/>
      <ellipse cx="138" cy="18" rx="34" ry="26" fill="#16A34A" stroke="#4ADE80" stroke-width="2"/>
    </g>
  </g>
</svg>
