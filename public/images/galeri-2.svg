<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gal2CleanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#gal2CleanBg)" />

  <!-- Clean Weighing Scale & Watermelon Inspection Vector Graphic -->
  <g transform="translate(260, 160)">
    <!-- Digital Scale Platform -->
    <rect x="0" y="190" width="280" height="50" rx="12" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <!-- Digital Weight Display -->
    <rect x="85" y="202" width="110" height="26" rx="6" fill="#0284C7" />
    <text x="140" y="221" fill="#FFFFFF" font-family="'Golos Text', monospace" font-size="16" font-weight="700" text-anchor="middle">8.45 kg</text>

    <!-- Watermelon On Scale -->
    <ellipse cx="140" cy="100" rx="110" ry="90" fill="#15803D" stroke="#22C55E" stroke-width="4" />
    <!-- Stripes -->
    <path d="M80,50 Q120,100 80,150" stroke="#052E16" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M140,20 Q170,100 140,180" stroke="#052E16" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M200,50 Q230,100 200,150" stroke="#052E16" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Grade Super Quality Stamp -->
    <circle cx="230" cy="60" r="36" fill="#E11D48" stroke="#FFFFFF" stroke-width="3"/>
    <text x="230" y="69" fill="#FFFFFF" font-family="'Figtree', sans-serif" font-size="22" font-weight="900" text-anchor="middle">A+</text>
  </g>
</svg>
